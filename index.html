<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>LogiFlow - Sistema de Logística Gamificado</title>
    <meta name="title" content="LogiFlow - Sistema de Logística Gamificado" />
    <meta name="description" content="Gerencie fretes internos, entregas de fornecedores e envios para clientes com gamificação e integração Bitrix24." />
    <meta name="author" content="LogiFlow" />
    
    <!-- PWA -->
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LogiFlow" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="/" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LogiFlow - Sistema de Logística Gamificado" />
    <meta property="og:description" content="Gerencie fretes internos, entregas de fornecedores e envios para clientes com gamificação." />
    <meta property="og:image" content="/icons/icon-512.svg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LogiFlow" />
    <meta name="twitter:image" content="/icons/icon-512.svg" />
    
    <!-- DNS prefetch for backend -->
    <link rel="dns-prefetch" href="https://uwbpzfcysppwikfpnzok.supabase.co" />
    <link rel="preconnect" href="https://uwbpzfcysppwikfpnzok.supabase.co" crossorigin />
    
    <!-- Fonts - preload for faster rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root">
      <!-- Branded Splash Screen — removed by React on mount -->
      <div id="splash-screen" style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: hsl(220 20% 7%);
        color: hsl(210 40% 98%);
        font-family: 'Outfit', system-ui, sans-serif;
        gap: 1.5rem;
      ">
        <div style="
          width: 56px; height: 56px;
          border-radius: 16px;
          background: linear-gradient(135deg, hsl(25 95% 53%), hsl(38 92% 50%));
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 0 30px hsl(25 95% 53% / 0.35);
          animation: splash-pulse 2s ease-in-out infinite;
        ">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
            <path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
          </svg>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;">LogiFlow</div>
          <div style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.5; margin-top: 4px;">Logística Gamificada</div>
        </div>
        <div style="
          width: 120px; height: 3px;
          border-radius: 4px;
          background: hsl(220 15% 18%);
          overflow: hidden;
          margin-top: 0.5rem;
        ">
          <div style="
            width: 40%; height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, hsl(25 95% 53%), hsl(38 92% 50%));
            animation: splash-loading 1.2s ease-in-out infinite;
          "></div>
        </div>
      </div>
      <style>
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.05); }
        }
        @keyframes splash-loading {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(350%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && !location.hostname.includes('lovableproject')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
