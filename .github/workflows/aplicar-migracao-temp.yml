name: Aplicar migracao (temporario)

on:
  push:
    branches:
      - 'claude/fix-rpcs-observabilidade-261117-1157'

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jvfhclubfpxrtrrazrgr
      ARQUIVO: supabase/migrations/20261117120000_fix_rpcs_observabilidade.sql
    steps:
      - uses: actions/checkout@v4
      - name: Validar token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN nao configurado."
            exit 1
          fi
      - name: Executar SQL via Management API
        run: |
          set -euo pipefail
          payload=$(jq -Rs '{query: .}' < "$ARQUIVO")
          codigo=$(curl -sS -o resposta.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "HTTP $codigo"
          cat resposta.json
          if [ "$codigo" != "200" ] && [ "$codigo" != "201" ]; then
            echo "::error::Falha ao aplicar a migracao."
            exit 1
          fi