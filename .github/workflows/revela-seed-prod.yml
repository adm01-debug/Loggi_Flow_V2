# TEMPORARIO: destravamento do seed prod (service-role key). Remover apos uso.
name: Revela Seed Prod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revela-e-seeda:
    runs-on: ubuntu-latest
    environment: banco-leitura
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verificar credenciais
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN ausente"; exit 1; fi
          if [ -z "$SEED_PASSWORD" ]; then echo "::error::SEED_PASSWORD ausente (criar em Settings > Environments > banco-leitura)"; exit 1; fi
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Revelar service role (nunca imprime o valor)
        run: |
          SR=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/jvfhclubfpxrtrrazrgr/api-keys?reveal=true" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const k=JSON.parse(s).find(x=>x.id==='service_role');if(!k)process.exit(9);console.log(k.api_key)})")
          if [ ${#SR} -lt 200 ]; then echo "::error::service_role curta demais, abortando (nunca imprimir)."; exit 9; fi
          echo "service_role revelada: ${SR:0:3}…${SR: -3} (len ${#SR})"
          export SUPABASE_SERVICE_ROLE_KEY="$SR"
          export SUPABASE_URL="https://jvfhclubfpxrtrrazrgr.supabase.co"
          export SEED_PASSWORD
          unset SR
          npm ci --silent
          npm run seed -- --confirmar-producao
