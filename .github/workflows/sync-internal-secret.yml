# Ressincroniza INTERNAL_FN_SECRET do vault para as edge functions
# Gatilho: manual (workflow_dispatch). Pre-requisito: secret DESTINO_URL no environment banco-leitura.
# Motivo: quando a env INTERNAL_FN_SECRET de uma function difere do vault, os crons tomam 401.
# Fluxo exato do runbook scripts/ops/pos_deploy_functions.sql PASSO 2, sem expor valor nenhum.
name: Sync Internal Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resync-secret:
    runs-on: ubuntu-latest
    environment: banco-leitura
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DESTINO_URL: ${{ secrets.DESTINO_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Exigir credencial do banco oficial
        run: |
          if [ -z "$DESTINO_URL" ]; then
            echo "::error::DESTINO_URL nao configurado no environment 'banco-leitura' (Settings > Environments > banco-leitura > Environment secrets). Sem ele nao consigo ler o vault para ressincronizar o secret."
            exit 1
          fi
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Ler secret do vault e aplicar nas functions (sem imprimir valor)
        run: |
          psql "$DESTINO_URL" -v ON_ERROR_STOP=1 -Atc "SELECT 'INTERNAL_FN_SECRET=' || decrypted_secret FROM vault.decrypted_secrets WHERE name = 'internal_fn_secret'" > /tmp/loggi-internal.env
          if [ ! -s /tmp/loggi-internal.env ]; then
            echo "::error::internal_fn_secret nao encontrado no vault do banco oficial."
            exit 1
          fi
          sh scripts/ops/set_missing_secrets.sh --env-file /tmp/loggi-internal.env
          sh scripts/ops/set_missing_secrets.sh --env-file /tmp/loggi-internal.env --apply
          rm -f /tmp/loggi-internal.env
