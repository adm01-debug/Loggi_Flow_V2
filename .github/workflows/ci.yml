name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks lê os commits do PR pela API (o repo é público; a permissão vale nos dois casos)

# Um push novo no mesmo ref cancela o run anterior em vez de empilhar.
# Sem isto, cada push cria 7 jobs novos e a fila cresce linearmente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks precisa do commit base do push (shallow quebra o range)
      - name: Audit Dependencies
        run: node scripts/audit-gate.mjs
      - name: Arquivo de ambiente fora do indice do git
        run: node scripts/ci/check-env-not-tracked.mjs
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  warning-budget:
    name: Warning Budget Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Enforce lint/TS warning budget
        run: npm run lint:budget

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  agents-docs:
    name: Agents Docs Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # o guard compara os bytes com a main (git cat-file na base)
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      # Guard sem dependencias: nao roda npm ci de proposito.
      - name: Integridade das instrucoes para agentes
        run: |
          git fetch --no-tags --depth=1 origin main
          CLAUDE_MD_BASE=FETCH_HEAD node scripts/ci/check-claude-md-integrity.mjs

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [security, lint, typecheck, warning-budget, test]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check Bundle Size
        run: |
          # Soma de todos os lazy chunks; vendor mapbox (~4MB minificado) é carregado sob demanda
          size=$(du -sk dist/assets | cut -f1)
          if [ "$size" -gt 8192 ]; then
            echo "Bundle size too large: ${size}KB"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/

