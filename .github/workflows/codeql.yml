# docs:
#   gatilho: agendado (diário) e dispatch
#   prova: analise estatica de seguranca (SAST) de src, scripts, functions e dos workflows
#   falha: alerta aparece em Security -> Code scanning
#   avisa: aba Security
# =================================================
# CodeQL — analise estatica de seguranca (SAST)
# =================================================
# Cobre JS/TS de src/, scripts/ e supabase/functions/, e os proprios workflows.
# Achados aparecem em Security -> Code scanning alerts.
# =================================================

name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *' # diario 06:30 BRT


defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: 🔬 CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧬 Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: '/language:javascript-typescript'

  # Job separado de proposito: o check do job "analyze" e required na branch
  # protection, e transformar aquele job numa matrix renomearia o check e
  # travaria todos os merges. A linguagem "actions" analisa os .github/workflows
  # em busca de injecao de expressao em run:, uso indevido de pull_request_target
  # e permissoes excessivas.
  analyze-actions:
    name: 🔬 CodeQL (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧬 Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none

      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: '/language:actions'
